[project]
name = "research-paper-rag"
version = "0.1.0"
description = "RAG system for querying research papers with citation support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # PDF Processing
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",

    # Embeddings & Vector Store
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",

    # LLM
    "openai>=1.0.0",
    "ollama>=0.1.0",

    # Retrieval
    "rank-bm25>=0.2.2",

    # API & Frontend
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "streamlit>=1.28.0",
    "python-multipart>=0.0.6",

    # Evaluation
    "ragas>=0.1.0",

    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
